name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.17.2 "**/*.md" "#**/node_modules/**" "#**/target/**" "#apps/desktop/dist/**" "#apps/desktop/src-tauri/gen/**"

      - name: Validate workflow syntax
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --verbose "./**/*.md"
          fail: true

  foundation:
    name: Foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "AGENTS.md"
            "LICENSE"
            "docs/PRD.md"
            "docs/ARCHITECTURE.md"
            "docs/ROADMAP.md"
            "docs/adr/README.md"
            ".github/workflows/ci.yml"
            ".github/workflows/pr-policy.yml"
          )
          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing required foundation file"
              exit 1
            fi
          done

      - name: Verify ADR numbering
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for file in docs/adr/[0-9][0-9][0-9][0-9]-*.md; do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            if ! printf '%s' "$name" | grep -Eq '^[0-9]{4}-[a-z0-9-]+\.md$'; then
              echo "::error file=$file::Invalid ADR filename"
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -lt 1 ]; then
            echo "::error::No ADR files found"
            exit 1
          fi
          echo "Found $count ADR files."

  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, and build JavaScript
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:i18n
          pnpm build

      - name: Format, lint, test, and build Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo build --workspace

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --no-git --redact --verbose
