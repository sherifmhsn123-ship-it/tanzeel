name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-body:
    name: PR body policy
    runs-on: ubuntu-latest
    steps:
      - name: Check required sections and content
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          sections=(
            "## المرحلة"
            "## ماذا ولماذا"
            "## البرومبت"
            "## الاختبارات"
            "## الحالات الصعبة"
            "## الأمان"
            "## الوثائق"
            "## المخاطر والتراجع"
          )

          missing=0
          for section in "${sections[@]}"; do
            if ! printf '%s\n' "$PR_BODY" | grep -qF -- "$section"; then
              echo "::error::Missing required PR section: $section"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Use .github/pull_request_template.md and complete every section."
            exit 1
          fi

          if ! printf '%s\n' "$PR_BODY" | grep -Eq 'Closes[[:space:]]+#[0-9]+|Refs[[:space:]]+#[0-9]+'; then
            echo "::error::PR must link an Issue with 'Closes #N' or 'Refs #N'."
            exit 1
          fi

          extract_section() {
            local heading="$1"
            printf '%s\n' "$PR_BODY" | awk -v h="$heading" '
              $0 == h { in_section = 1; next }
              in_section && /^## / { in_section = 0 }
              in_section { print }
            ' | sed '/^<!--/,/-->/d'
          }

          if [ -z "$(extract_section "## البرومبت" | tr -d '[:space:]')" ]; then
            echo "::error::The '## البرومبت' section must contain the exact prompt."
            exit 1
          fi

          if [ -z "$(extract_section "## الاختبارات" | tr -d '[:space:]')" ]; then
            echo "::error::The '## الاختبارات' section must contain commands and results."
            exit 1
          fi

          echo "PR body policy passed."
