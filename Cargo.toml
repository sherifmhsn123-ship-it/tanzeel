[workspace]
resolver = "2"
members = [
  "crates/tanzeel-core",
  "crates/tanzeel-storage",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
tanzeel-core = { path = "crates/tanzeel-core" }
tanzeel-storage = { path = "crates/tanzeel-storage" }
